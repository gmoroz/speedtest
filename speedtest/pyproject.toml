[project]
name = "speedtest"
version = "0.1.0"
description = "Замер скорости загрузки: N последовательных запросов к URL, средние время и объём, МБ/с"
requires-python = "==3.14.*"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
]

[project.scripts]
"speedtest" = "speedtest.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-socket==0.8.1",
    "pytest-timeout==2.4.0",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "vulture==2.16",
    "import-linter==2.15",
    "coverage==7.16.2",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speedtest"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TID", "RUF",
    "PLC0415", "T201", "BLE001",
    "FIX001", "FIX002", "FIX004",
    "ASYNC251",
    "ERA", "C901",
    "S", "PGH003", "PGH004",
]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Использовать httpx вместо requests."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG", "T201"]
"tests/integration/test_cli.py" = ["S603"]
"src/speedtest/cli.py" = ["T201"]
"src/speedtest/__main__.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
enable_error_code = ["ignore-without-code"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.vulture]
min_confidence = 60
paths = ["src", "vulture_whitelist.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
strict = true
markers = ["integration: тесты с реальным локальным HTTP-сервером"]
# Единственный источник порога coverage - --cov-fail-under ниже.
addopts = "--import-mode=importlib --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=80 --disable-socket --allow-hosts=127.0.0.1,localhost --allow-unix-socket --timeout=30"
timeout_method = "thread"
timeout = 30

[tool.coverage.run]
branch = true
source = ["src"]

[tool.importlinter]
root_package = "speedtest"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Слои cli -> services -> clients"
type = "layers"
containers = ["speedtest"]
layers = [
    "cli",
    "services",
    "clients",
]

[[tool.importlinter.contracts]]
name = "Сервис не импортирует httpx"
type = "forbidden"
source_modules = ["speedtest.services"]
forbidden_modules = ["httpx"]
